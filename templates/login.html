{% extends "base.html" %}
{% block title %}Login — Flashee{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Welcome Back! 🎉</h1>
    <p class="auth-sub">Log in to access your orders and saved items.</p>

    <!-- Google Login (UI only) -->
    <button class="google-btn" onclick="alert('Google login is not connected in this demo.')">
      <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" width="20" />
      Continue with Google
    </button>

    <div class="auth-divider"><span>or</span></div>

    <!-- Email/Password Form -->
    <form action="{{ url_for('login') }}" method="POST" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. John"
               class="auth-input" />
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com"
               class="auth-input" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password"
               class="auth-input" required />
      </div>
      <a href="#" class="forgot-link">Forgot your password?</a>
      <button type="submit" class="btn-primary full-width">Log In</button>
    </form>

    <p class="auth-switch">
      Don't have an account?
      <a href="{{ url_for('signup') }}">Sign Up</a>
    </p>
  </div>
</div>
{% endblock %}
