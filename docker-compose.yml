# docker-compose.yml — Flashee single-service setup

version: "3.9"

services:
  flashee:
    build: .
    container_name: flashee_app
    ports:
      - "5000:5000"

    env_file:
      - ./.env

    environment:
      - FLASK_ENV=development

    volumes:
      - .:/app

    restart: unless-stopped